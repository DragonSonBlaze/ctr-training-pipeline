[project]
name = "ctr-pipeline"
version = "0.1.0"
description = "Batch training-data and ML pipeline for click-through rate prediction on the Avazu ad logs"
requires-python = ">=3.12,<3.13"
dependencies = [
    # Spark 4.x runs on Java 17 or 21. Spark 3.5 does not support Java 21.
    "pyspark>=4.0,<5",
    "pyarrow>=17",
    "pandas>=2.2",
    "torch>=2.5",
    # Must match MLFLOW_VERSION in .env, which sets the tracking server's version.
    "mlflow==3.18.0",
    "psycopg[binary]>=3.2",
    "scikit-learn>=1.9.1",
]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "ruff>=0.8",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/ctr_pipeline"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP"]
